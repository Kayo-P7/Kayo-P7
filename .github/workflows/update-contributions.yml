name: Update Contribution Animation

on:
  push:
    branches:
      - main
      - master

  schedule:
    - cron: "0 3 * * *"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate contribution animation
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |

          python3 << 'PY'

          import json
          import os
          import urllib.request
          from datetime import datetime

          USERNAME = "Kayo-P7"

          QUERY = """
          query($login: String!) {
            user(login: $login) {
              contributionsCollection {
                contributionCalendar {
                  totalContributions
                  weeks {
                    contributionDays {
                      date
                      contributionCount
                      contributionLevel
                    }
                  }
                }
              }
            }
          }
          """

          payload = json.dumps({
              "query": QUERY,
              "variables": {
                  "login": USERNAME
              }
          }).encode("utf-8")

          request = urllib.request.Request(
              "https://api.github.com/graphql",
              data=payload,
              headers={
                  "Authorization": f"Bearer {os.environ['GITHUB_TOKEN']}",
                  "Content-Type": "application/json",
                  "User-Agent": "Kayo-P7-Contribution-Animation"
              }
          )

          with urllib.request.urlopen(request) as response:
              result = json.load(response)

          if "errors" in result:
              raise RuntimeError(result["errors"])

          calendar = (
              result["data"]
              ["user"]
              ["contributionsCollection"]
              ["contributionCalendar"]
          )

          total = calendar["totalContributions"]

          days = []

          for week in calendar["weeks"]:
              for day in week["contributionDays"]:
                  days.append(day)

          # Ordena por data
          days.sort(key=lambda item: item["date"])

          # =========================================================
          # CONFIGURAÇÃO VISUAL
          # =========================================================

          WIDTH = 900
          HEIGHT = 260

          LEFT = 40
          TOP = 110

          CELL = 18
          GAP = 5

          # Calcula uma célula por dia do calendário.
          # O calendário do GitHub normalmente possui ~53 semanas.
          # Aqui mostramos os últimos 18 meses de atividade.
          recent_days = days[-365:]

          # =========================================================
          # GERA OS BLOCOS
          # =========================================================

          squares = []

          for index, day in enumerate(recent_days):

              week = index // 7
              weekday = index % 7

              x = LEFT + week * (CELL + GAP)
              y = TOP + weekday * (CELL + GAP)

              count = day["contributionCount"]

              if count == 0:
                  fill = "#160000"
              elif count == 1:
                  fill = "#4a0000"
              elif count <= 3:
                  fill = "#760000"
              elif count <= 6:
                  fill = "#b00000"
              else:
                  fill = "#ff2222"

              # Último dia com contribuição recebe animação.
              is_latest = (
                  count > 0
                  and all(
                      d["contributionCount"] == 0
                      for d in recent_days[index + 1:]
                  )
              )

              if is_latest:

                  squares.append(
                      f"""
                      <rect
                        x="{x}"
                        y="{y}"
                        width="{CELL}"
                        height="{CELL}"
                        rx="4"
                        fill="{fill}">
                        <animate
                          attributeName="opacity"
                          values="1;0.35;1"
                          dur="1.4s"
                          repeatCount="indefinite"/>
                        <animate
                          attributeName="width"
                          values="{CELL};{CELL + 3};{CELL}"
                          dur="1.4s"
                          repeatCount="indefinite"/>
                        <animate
                          attributeName="height"
                          values="{CELL};{CELL + 3};{CELL}"
                          dur="1.4s"
                          repeatCount="indefinite"/>
                      </rect>
                      """
                  )

              else:

                  squares.append(
                      f"""
                      <rect
                        x="{x}"
                        y="{y}"
                        width="{CELL}"
                        height="{CELL}"
                        rx="4"
                        fill="{fill}"/>
                      """
                  )

          # =========================================================
          # SVG
          # =========================================================

          svg = f"""
          <svg
            width="{WIDTH}"
            height="{HEIGHT}"
            viewBox="0 0 {WIDTH} {HEIGHT}"
            xmlns="http://www.w3.org/2000/svg">

            <defs>

              <linearGradient
                id="background"
                x1="0%"
                y1="0%"
                x2="100%"
                y2="100%">

                <stop
                  offset="0%"
                  stop-color="#030303"/>

                <stop
                  offset="100%"
                  stop-color="#170000"/>

              </linearGradient>

              <filter id="glow">

                <feGaussianBlur
                  stdDeviation="4"
                  result="blur"/>

                <feMerge>

                  <feMergeNode in="blur"/>

                  <feMergeNode in="SourceGraphic"/>

                </feMerge>

              </filter>

            </defs>

            <!-- BACKGROUND -->

            <rect
              width="100%"
              height="100%"
              rx="18"
              fill="url(#background)"
              stroke="#4d0000"
              stroke-width="2"/>

            <!-- TITLE -->

            <text
              x="32"
              y="38"
              font-family="monospace"
              font-size="18"
              font-weight="bold"
              fill="#ff2b2b">

              CONTRIBUTION ACTIVITY

            </text>

            <!-- USER -->

            <text
              x="32"
              y="62"
              font-family="monospace"
              font-size="12"
              fill="#777">

              Kayo-P7 / github.com

            </text>

            <!-- TOTAL -->

            <text
              x="865"
              y="43"
              text-anchor="end"
              font-family="monospace"
              font-size="18"
              font-weight="bold"
              fill="#ffffff">

              {total}

            </text>

            <text
              x="865"
              y="62"
              text-anchor="end"
              font-family="monospace"
              font-size="11"
              fill="#777">

              CONTRIBUTIONS

            </text>

            <!-- SEPARATOR -->

            <line
              x1="32"
              y1="78"
              x2="868"
              y2="78"
              stroke="#350000"
              stroke-width="1"/>

            <!-- CONTRIBUTION GRID -->

            {''.join(squares)}

            <!-- LEGEND -->

            <text
              x="32"
              y="244"
              font-family="monospace"
              font-size="10"
              fill="#666">

              ACTIVITY

            </text>

            <rect
              x="92"
              y="235"
              width="11"
              height="11"
              rx="2"
              fill="#160000"/>

            <rect
              x="109"
              y="235"
              width="11"
              height="11"
              rx="2"
              fill="#4a0000"/>

            <rect
              x="126"
              y="235"
              width="11"
              height="11"
              rx="2"
              fill="#760000"/>

            <rect
              x="143"
              y="235"
              width="11"
              height="11"
              rx="2"
              fill="#b00000"/>

            <rect
              x="160"
              y="235"
              width="11"
              height="11"
              rx="2"
              fill="#ff2222"/>

            <text
              x="185"
              y="244"
              font-family="monospace"
              font-size="10"
              fill="#666">

              LESS → MORE

            </text>

          </svg>
          """

          os.makedirs("assets", exist_ok=True)

          with open(
              "assets/contributions.svg",
              "w",
              encoding="utf-8"
          ) as file:

              file.write(svg)

          print(
              f"Generated contribution animation with {total} contributions."
          )

          PY

      - name: Commit updated animation
        run: |

          git config user.name "github-actions[bot]"

          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add assets/contributions.svg

          if git diff --cached --quiet; then

            echo "No changes."

          else

            git commit -m "chore: update contribution animation"

            git push

          fi
