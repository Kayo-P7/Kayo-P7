name: Update Contribution Animation

on:
  push:
    branches:
      - main
      - master

  schedule:
    - cron: "0 3 * * *"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v5

      - name: Generate contribution animation
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |

          python3 << 'PY'

          import json
          import os
          import urllib.request
          from datetime import datetime

          USERNAME = "Kayo-P7"

          QUERY = """
          query($login: String!) {
            user(login: $login) {
              contributionsCollection {
                contributionCalendar {
                  totalContributions

                  weeks {
                    contributionDays {
                      date
                      contributionCount
                    }
                  }
                }
              }
            }
          }
          """

          payload = json.dumps({
              "query": QUERY,
              "variables": {
                  "login": USERNAME
              }
          }).encode("utf-8")

          request = urllib.request.Request(
              "https://api.github.com/graphql",
              data=payload,
              headers={
                  "Authorization": f"Bearer {os.environ['GITHUB_TOKEN']}",
                  "Content-Type": "application/json",
                  "User-Agent": "Kayo-P7"
              }
          )

          with urllib.request.urlopen(request) as response:
              result = json.load(response)

          if "errors" in result:
              raise RuntimeError(result["errors"])

          calendar = (
              result["data"]
              ["user"]
              ["contributionsCollection"]
              ["contributionCalendar"]
          )

          total = calendar["totalContributions"]

          days = []

          for week in calendar["weeks"]:
              for day in week["contributionDays"]:
                  days.append(day)

          days.sort(key=lambda x: x["date"])

          # =========================================================
          # PEGAR OS ÚLTIMOS 30 DIAS COM ATIVIDADE
          # =========================================================

          active_days = [
              day for day in days
              if day["contributionCount"] > 0
          ]

          active_days = active_days[-30:]

          # =========================================================
          # CONFIGURAÇÃO
          # =========================================================

          WIDTH = 900
          HEIGHT = 230

          START_X = 55
          END_X = 845

          if len(active_days) > 1:
              STEP = (END_X - START_X) / (len(active_days) - 1)
          else:
              STEP = 0

          # =========================================================
          # LINHA
          # =========================================================

          points = []

          max_count = max(
              [d["contributionCount"] for d in active_days],
              default=1
          )

          for i, day in enumerate(active_days):

              count = day["contributionCount"]

              x = START_X + (i * STEP)

              # Mais contribuições = ponto mais alto
              normalized = count / max_count

              y = 145 - (normalized * 65)

              points.append(
                  f"{x:.2f},{y:.2f}"
              )

          polyline = " ".join(points)

          # =========================================================
          # PONTOS
          # =========================================================

          circles = []

          for i, day in enumerate(active_days):

              count = day["contributionCount"]

              x = START_X + (i * STEP)

              normalized = count / max_count

              y = 145 - (normalized * 65)

              # intensidade do vermelho

              if count >= 10:
                  color = "#ff2020"
                  radius = 8

              elif count >= 5:
                  color = "#d00000"
                  radius = 7

              elif count >= 2:
                  color = "#8f0000"
                  radius = 6

              else:
                  color = "#550000"
                  radius = 5

              # última contribuição
              is_latest = i == len(active_days) - 1

              if is_latest:

                  circles.append(
                      f"""
                      <circle
                        cx="{x:.2f}"
                        cy="{y:.2f}"
                        r="{radius}"
                        fill="{color}">

                        <animate
                          attributeName="r"
                          values="{radius};{radius + 4};{radius}"
                          dur="1.4s"
                          repeatCount="indefinite"/>

                        <animate
                          attributeName="opacity"
                          values="1;0.4;1"
                          dur="1.4s"
                          repeatCount="indefinite"/>

                      </circle>

                      <circle
                        cx="{x:.2f}"
                        cy="{y:.2f}"
                        r="{radius + 7}"
                        fill="none"
                        stroke="#ff2020"
                        stroke-width="1"
                        opacity="0.35">

                        <animate
                          attributeName="r"
                          values="{radius + 2};{radius + 12}"
                          dur="1.4s"
                          repeatCount="indefinite"/>

                        <animate
                          attributeName="opacity"
                          values="0.5;0"
                          dur="1.4s"
                          repeatCount="indefinite"/>

                      </circle>
                      """

                  )

              else:

                  circles.append(
                      f"""
                      <circle
                        cx="{x:.2f}"
                        cy="{y:.2f}"
                        r="{radius}"
                        fill="{color}"/>
                      """
                  )

          # =========================================================
          # SVG
          # =========================================================

          svg = f"""
          <svg
            width="{WIDTH}"
            height="{HEIGHT}"
            viewBox="0 0 {WIDTH} {HEIGHT}"
            xmlns="http://www.w3.org/2000/svg">

            <defs>

              <linearGradient
                id="background"
                x1="0%"
                y1="0%"
                x2="100%"
                y2="100%">

                <stop
                  offset="0%"
                  stop-color="#030303"/>

                <stop
                  offset="100%"
                  stop-color="#170000"/>

              </linearGradient>

              <filter id="glow">

                <feGaussianBlur
                  stdDeviation="3"
                  result="blur"/>

                <feMerge>

                  <feMergeNode in="blur"/>

                  <feMergeNode in="SourceGraphic"/>

                </feMerge>

              </filter>

            </defs>


            <!-- BACKGROUND -->

            <rect
              width="100%"
              height="100%"
              rx="18"
              fill="url(#background)"
              stroke="#3d0000"
              stroke-width="2"/>


            <!-- TITLE -->

            <text
              x="35"
              y="35"
              font-family="monospace"
              font-size="18"
              font-weight="bold"
              fill="#ff2020">

              CONTRIBUTION ACTIVITY

            </text>


            <!-- USER -->

            <text
              x="35"
              y="57"
              font-family="monospace"
              font-size="11"
              fill="#777">

              Kayo-P7 / GitHub

            </text>


            <!-- TOTAL -->

            <text
              x="865"
              y="36"
              text-anchor="end"
              font-family="monospace"
              font-size="19"
              font-weight="bold"
              fill="#ffffff">

              {total}

            </text>


            <text
              x="865"
              y="55"
              text-anchor="end"
              font-family="monospace"
              font-size="10"
              fill="#777">

              CONTRIBUTIONS

            </text>


            <!-- SEPARATOR -->

            <line
              x1="35"
              y1="75"
              x2="865"
              y2="75"
              stroke="#3d0000"
              stroke-width="1"/>


            <!-- AXIS -->

            <line
              x1="55"
              y1="145"
              x2="845"
              y2="145"
              stroke="#250000"
              stroke-width="1"/>


            <!-- ACTIVITY LINE -->

            <polyline
              points="{polyline}"
              fill="none"
              stroke="#b00000"
              stroke-width="3"
              stroke-linecap="round"
              stroke-linejoin="round"
              filter="url(#glow)"/>


            <!-- POINTS -->

            {''.join(circles)}


            <!-- LABELS -->

            <text
              x="35"
              y="195"
              font-family="monospace"
              font-size="10"
              fill="#666">

              RECENT ACTIVITY

            </text>


            <text
              x="865"
              y="195"
              text-anchor="end"
              font-family="monospace"
              font-size="10"
              fill="#ff2020">

              LIVE

            </text>


            <text
              x="35"
              y="215"
              font-family="monospace"
              font-size="9"
              fill="#555">

              Each point represents a contribution day

            </text>

          </svg>
          """

          os.makedirs("assets", exist_ok=True)

          with open(
              "assets/contributions.svg",
              "w",
              encoding="utf-8"
          ) as file:

              file.write(svg)

          print(
              f"Generated animation for {total} contributions."
          )

          PY


      - name: Commit updated animation
        run: |

          git config user.name "github-actions[bot]"

          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add assets/contributions.svg

          if git diff --cached --quiet; then

            echo "No changes."

          else

            git commit \
              -m "chore: update contribution animation"

            git push

          fi
