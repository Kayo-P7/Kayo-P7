name: Update Contribution Animation

on:
  push:
    branches:
      - main
      - master

  schedule:
    - cron: "0 3 * * *"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Generate contribution animation
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |

          python3 << 'PY'

          import json
          import os
          import urllib.request

          USERNAME = "Kayo-P7"

          QUERY = """
          query($login: String!) {
            user(login: $login) {
              contributionsCollection {
                contributionCalendar {
                  totalContributions

                  weeks {
                    contributionDays {
                      date
                      contributionCount
                    }
                  }
                }
              }
            }
          }
          """

          payload = json.dumps({
              "query": QUERY,
              "variables": {
                  "login": USERNAME
              }
          }).encode("utf-8")

          request = urllib.request.Request(
              "https://api.github.com/graphql",
              data=payload,
              headers={
                  "Authorization": f"Bearer {os.environ['GITHUB_TOKEN']}",
                  "Content-Type": "application/json",
                  "User-Agent": "Kayo-P7-Contribution-Animation"
              }
          )

          with urllib.request.urlopen(request) as response:
              result = json.load(response)

          if "errors" in result:
              raise RuntimeError(result["errors"])

          calendar = (
              result["data"]
              ["user"]
              ["contributionsCollection"]
              ["contributionCalendar"]
          )

          total = calendar["totalContributions"]

          weeks = calendar["weeks"]

          # ==========================================================
          # VISUAL CONFIGURATION
          # ==========================================================

          WIDTH = 900
          HEIGHT = 220

          GRID_X = 32
          GRID_Y = 105

          CELL = 11
          GAP = 3

          # GitHub normally returns 53 weeks.
          # We limit the visual grid to 53 columns.
          weeks = weeks[-53:]

          squares = []

          latest_date = None

          # Find latest day that has a contribution
          for week in weeks:
              for day in week["contributionDays"]:
                  if day["contributionCount"] > 0:
                      latest_date = day["date"]

          # ==========================================================
          # CONTRIBUTION GRID
          # ==========================================================

          for week_index, week in enumerate(weeks):

              x = GRID_X + week_index * (CELL + GAP)

              for day_index, day in enumerate(
                  week["contributionDays"]
              ):

                  y = GRID_Y + day_index * (CELL + GAP)

                  count = day["contributionCount"]

                  # ==================================================
                  # RED INTENSITY
                  # ==================================================

                  if count == 0:
                      fill = "#170000"

                  elif count == 1:
                      fill = "#4d0000"

                  elif count <= 3:
                      fill = "#720000"

                  elif count <= 6:
                      fill = "#ad0000"

                  elif count <= 10:
                      fill = "#df0000"

                  else:
                      fill = "#ff2b2b"

                  # ==================================================
                  # LATEST CONTRIBUTION
                  # ==================================================

                  if day["date"] == latest_date:

                      squares.append(
                          f'''
                          <rect
                            x="{x}"
                            y="{y}"
                            width="{CELL}"
                            height="{CELL}"
                            rx="3"
                            fill="{fill}">

                            <title>
                              {day["date"]}: {count} contributions
                            </title>

                            <animate
                              attributeName="opacity"
                              values="1;0.35;1"
                              dur="1.4s"
                              repeatCount="indefinite"/>

                          </rect>
                          '''
                      )

                  else:

                      squares.append(
                          f'''
                          <rect
                            x="{x}"
                            y="{y}"
                            width="{CELL}"
                            height="{CELL}"
                            rx="3"
                            fill="{fill}">

                            <title>
                              {day["date"]}: {count} contributions
                            </title>

                          </rect>
                          '''
                      )

          # ==========================================================
          # SVG
          # ==========================================================

          svg = f'''
          <svg
            width="{WIDTH}"
            height="{HEIGHT}"
            viewBox="0 0 {WIDTH} {HEIGHT}"
            xmlns="http://www.w3.org/2000/svg">

            <defs>

              <linearGradient
                id="background"
                x1="0%"
                y1="0%"
                x2="100%"
                y2="100%">

                <stop
                  offset="0%"
                  stop-color="#030303"/>

                <stop
                  offset="100%"
                  stop-color="#160000"/>

              </linearGradient>

              <filter id="redGlow">

                <feGaussianBlur
                  stdDeviation="4"
                  result="blur"/>

                <feMerge>

                  <feMergeNode in="blur"/>

                  <feMergeNode in="SourceGraphic"/>

                </feMerge>

              </filter>

            </defs>

            <!-- BACKGROUND -->

            <rect
              width="100%"
              height="100%"
              rx="16"
              fill="url(#background)"
              stroke="#3d0000"
              stroke-width="2"/>


            <!-- TITLE -->

            <text
              x="32"
              y="34"
              font-family="monospace"
              font-size="18"
              font-weight="bold"
              fill="#ff3030">

              CONTRIBUTION ACTIVITY

            </text>


            <!-- USER -->

            <text
              x="32"
              y="55"
              font-family="monospace"
              font-size="11"
              fill="#777">

              Kayo-P7 / GitHub

            </text>


            <!-- TOTAL -->

            <text
              x="865"
              y="37"
              text-anchor="end"
              font-family="monospace"
              font-size="18"
              font-weight="bold"
              fill="#ffffff">

              {total}

            </text>

            <text
              x="865"
              y="55"
              text-anchor="end"
              font-family="monospace"
              font-size="10"
              fill="#777">

              CONTRIBUTIONS

            </text>


            <!-- LINE -->

            <line
              x1="32"
              y1="70"
              x2="868"
              y2="70"
              stroke="#3d0000"
              stroke-width="1"/>


            <!-- GRID -->

            {''.join(squares)}


            <!-- LEGEND -->

            <text
              x="32"
              y="210"
              font-family="monospace"
              font-size="9"
              fill="#666">

              LESS

            </text>

            <rect
              x="65"
              y="202"
              width="10"
              height="10"
              rx="2"
              fill="#170000"/>

            <rect
              x="81"
              y="202"
              width="10"
              height="10"
              rx="2"
              fill="#4d0000"/>

            <rect
              x="97"
              y="202"
              width="10"
              height="10"
              rx="2"
              fill="#720000"/>

            <rect
              x="113"
              y="202"
              width="10"
              height="10"
              rx="2"
              fill="#ad0000"/>

            <rect
              x="129"
              y="202"
              width="10"
              height="10"
              rx="2"
              fill="#df0000"/>

            <rect
              x="145"
              y="202"
              width="10"
              height="10"
              rx="2"
              fill="#ff2b2b"/>

            <text
              x="166"
              y="210"
              font-family="monospace"
              font-size="9"
              fill="#666">

              MORE

            </text>

          </svg>
          '''

          os.makedirs("assets", exist_ok=True)

          with open(
              "assets/contributions.svg",
              "w",
              encoding="utf-8"
          ) as file:

              file.write(svg)

          print(
              f"Generated animation with {total} total contributions."
          )

          PY


      - name: Commit updated animation
        run: |

          git config user.name "github-actions[bot]"

          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add assets/contributions.svg

          if git diff --cached --quiet; then

            echo "No changes detected."

          else

            git commit \
              -m "chore: update contribution animation"

            git push

          fi
